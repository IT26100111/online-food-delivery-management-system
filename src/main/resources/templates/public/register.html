
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | FoodFlow</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #fff8f3;
            font-family: 'Inter', Arial, sans-serif;
        }

        .register-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 55px 20px;
        }

        .register-card {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border: 1px solid #eeeeee;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 14px 45px rgba(0, 0, 0, 0.06);
        }

        .brand {
            text-decoration: none;
            color: #ff642d;
            font-size: 27px;
            font-weight: 800;
        }

        .register-card h1 {
            margin-top: 30px;
            font-size: 30px;
            font-weight: 800;
            color: #222222;
        }

        .register-subtitle {
            font-size: 14px;
            color: #777777;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
            font-size: 13px;
            color: #333333;
        }

        .form-control {
            padding: 13px 15px;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: #ff642d;
            box-shadow: 0 0 0 3px rgba(255, 100, 45, 0.12);
        }

        .register-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #ff642d;
            color: white;
            font-weight: 700;
            transition: background 0.2s;
        }

        .register-button:hover {
            background: #e45121;
        }

        .helper-text {
            color: #888888;
            font-size: 12px;
        }

        .back-link {
            color: #ff642d;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 576px) {
            .register-card {
                padding: 26px;
            }
        }
    </style>
</head>

<body>

<main class="register-wrapper">

    <div class="register-card">

        <a th:href="@{/}" class="brand">
            FoodFlow
        </a>

        <h1>Create your account</h1>

        <p class="register-subtitle">
            Join FoodFlow and get ready to order your
            favorite meals.
        </p>

        <!-- SUCCESS -->
        <div th:if="${success}"
             class="alert alert-success"
             role="status">

            <span th:text="${success}"></span>

            <p class="mb-0 mt-2 small">
                Account login will be available once
                the sign-in feature is enabled.
            </p>
        </div>

        <form th:action="@{/register}"
              th:object="${registrationForm}"
              method="post">

            <!-- GLOBAL ERRORS -->
            <div th:if="${#fields.hasGlobalErrors()}"
                 class="alert alert-danger"
                 role="alert">

                <div th:each="error : ${#fields.globalErrors()}"
                     th:text="${error}">
                </div>
            </div>

            <!-- EMAIL -->
            <div class="mb-4">

                <label for="email" class="form-label">
                    Email Address
                </label>

                <input
                        type="email"
                        id="email"
                        th:field="*{email}"
                        class="form-control"
                        th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                        placeholder="you@example.com"
                        autocomplete="email"
                        maxlength="254"
                        required>

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}">
                </div>

            </div>

            <!-- PASSWORD -->
            <div class="mb-4">

                <label for="password" class="form-label">
                    Password
                </label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="8"
                        required>

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('password')}"
                     th:errors="*{password}">
                </div>

                <p class="helper-text mt-2 mb-0">
                    At least 8 characters.
                </p>

            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="mb-4">

                <label for="confirmPassword"
                       class="form-label">
                    Confirm Password
                </label>

                <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        class="form-control"
                        th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                        placeholder="Enter your password again"
                        autocomplete="new-password"
                        required>

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('confirmPassword')}"
                     th:errors="*{confirmPassword}">
                </div>

            </div>

            <button type="submit"
                    class="register-button">
                Create Account
            </button>

        </form>

        <div class="text-center mt-4">

            <p class="helper-text mb-2">
                Want to explore first?
            </p>

            <a th:href="@{/}" class="back-link">
                Back to FoodFlow
            </a>

        </div>

    </div>

</main>

</body>
</html>
