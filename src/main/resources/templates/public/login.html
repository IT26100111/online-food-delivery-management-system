
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Login | FoodFlow</title>

  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/style.css}">

  <style>
    body {
        min-height: 100vh;
        margin: 0;
        background: #fff8f3;
        font-family: 'Inter', Arial, sans-serif;
    }

    .login-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 50px 20px;
    }

    .login-card {
        width: 100%;
        max-width: 470px;
        padding: 42px;
        background: white;
        border: 1px solid #eeeeee;
        border-radius: 20px;
        box-shadow: 0 15px 45px rgba(0,0,0,0.06);
    }

    .brand {
        color: #ff642d;
        font-size: 28px;
        font-weight: 800;
        text-decoration: none;
    }

    .login-card h1 {
        font-size: 30px;
        font-weight: 800;
        color: #222;
        margin-top: 28px;
    }

    .subtitle {
        font-size: 14px;
        color: #777;
        margin-bottom: 30px;
    }

    .form-label {
        font-size: 13px;
        font-weight: 700;
        color: #333;
    }

    .form-control {
        padding: 13px 15px;
        border-radius: 10px;
    }

    .form-control:focus {
        border-color: #ff642d;
        box-shadow: 0 0 0 3px rgba(255,100,45,.12);
    }

    .login-button {
        width: 100%;
        border: none;
        border-radius: 10px;
        padding: 14px;
        background: #ff642d;
        color: white;
        font-weight: 700;
        margin-top: 12px;
    }

    .login-button:hover {
        background: #e45121;
    }

    .register-link {
        color: #ff642d;
        font-weight: 700;
        text-decoration: none;
    }

    .helper-text {
        font-size: 13px;
        color: #777;
    }

    @media (max-width: 576px) {
        .login-card {
            padding: 26px;
        }
    }
  </style>
</head>

<body>

<main class="login-wrapper">

  <div class="login-card">

    <a th:href="@{/}" class="brand">
      FoodFlow
    </a>

    <h1>Welcome back!</h1>

    <p class="subtitle">
      Sign in to your FoodFlow account.
    </p>

    <!-- LOGIN ERROR -->
    <div th:if="${param.error}"
         class="alert alert-danger"
         role="alert">

      Invalid email or password.

    </div>

    <!-- LOGOUT SUCCESS -->
    <div th:if="${param.logout}"
         class="alert alert-success"
         role="status">

      You have successfully logged out.

    </div>

    <!-- LOGIN FORM -->
    <form th:action="@{/login}"
          method="post">

      <!-- EMAIL -->
      <div class="mb-4">

        <label for="username"
               class="form-label">
          Email Address
        </label>

        <input
                type="email"
                id="username"
                name="username"
                class="form-control"
                placeholder="you@example.com"
                autocomplete="username"
                required>

      </div>

      <!-- PASSWORD -->
      <div class="mb-4">

        <label for="password"
               class="form-label">
          Password
        </label>

        <input
                type="password"
                id="password"
                name="password"
                class="form-control"
                placeholder="Enter your password"
                autocomplete="current-password"
                required>

      </div>

      <!-- LOGIN BUTTON -->
      <button type="submit"
              class="login-button">
        Sign In
      </button>

    </form>

    <div class="text-center mt-4">

      <p class="helper-text">
        Don't have an account?

        <a th:href="@{/register}"
           class="register-link">
          Create Account
        </a>
      </p>

      <a th:href="@{/}"
         class="register-link">
        Back to Home
      </a>

    </div>

  </div>

</main>

</body>
</html>
