
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Profile | FoodFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-sm mx-auto" style="max-width: 650px;">
        <div class="card-header bg-dark text-white">
            <h4 class="mb-0">My Driver Profile</h4>
        </div>

        <div class="card-body" th:if="${driver != null}">

            <p><strong>Driver ID:</strong>
                <span th:text="${driver.driverId}"></span>
            </p>

            <p><strong>Full Name:</strong>
                <span th:text="${driver.fullName}"></span>
            </p>

            <p><strong>Email:</strong>
                <span th:text="${driver.email}"></span>
            </p>

            <p><strong>Phone Number:</strong>
                <span th:text="${driver.phoneNumber}"></span>
            </p>

            <p><strong>Vehicle Number:</strong>
                <span th:text="${driver.vehicleNumber}"></span>
            </p>

            <p><strong>Status:</strong>
                <span th:text="${driver.status}"></span>
            </p>

            <a th:href="@{/driver/dashboard}" class="btn btn-secondary">
                Back to Dashboard
            </a>
        </div>

        <div class="card-body" th:if="${driver == null}">
            <p class="text-danger">Driver profile not found.</p>
            <a th:href="@{/driver/dashboard}" class="btn btn-secondary">
                Back to Dashboard
            </a>
        </div>
    </div>

</div>

</body>
</html>
