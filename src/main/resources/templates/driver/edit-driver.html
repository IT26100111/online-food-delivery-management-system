<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Delivery Driver | FoodFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">

        <h2 class="mb-4">Edit Delivery Driver</h2>

        <form th:action="@{/admin/drivers/update/{id}(id=${driver.driverId})}"
              th:object="${driver}" method="post">

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" th:field="*{fullName}"
                       class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" th:field="*{email}"
                       class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="tel" th:field="*{phoneNumber}"
                       class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" name="password"
                       class="form-control" minlength="8"
                       placeholder="Leave blank to keep current password">
            </div>

            <div class="mb-3">
                <label class="form-label">Vehicle Number</label>
                <input type="text" th:field="*{vehicleNumber}"
                       class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Account Status</label>
                <select th:field="*{status}" class="form-select" required>
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">
                Update Driver
            </button>

            <a th:href="@{/admin/drivers}"
               class="btn btn-secondary">Cancel</a>

        </form>

    </div>
</div>

</body>
</html>
