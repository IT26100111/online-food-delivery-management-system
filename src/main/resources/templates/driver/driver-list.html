<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Management | FoodFlow</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Delivery Driver Management</h2>

    <a th:href="@{/admin/drivers/add}" class="btn btn-primary">
      + Add New Driver
    </a>
  </div>

  <div class="card shadow">
    <div class="card-body">

      <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Full Name</th>
          <th>Email</th>
          <th>Phone Number</th>
          <th>Vehicle Number</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="driver : ${drivers}">
          <td th:text="${driver.driverId}"></td>
          <td th:text="${driver.fullName}"></td>
          <td th:text="${driver.email}"></td>
          <td th:text="${driver.phoneNumber}"></td>
          <td th:text="${driver.vehicleNumber}"></td>
          <td th:text="${driver.status}"></td>

          <td>
            <!-- Edit Button -->
            <a th:href="@{/admin/drivers/edit/{id}(id=${driver.driverId})}"
               class="btn btn-warning btn-sm">
              Edit
            </a>

            <!-- Delete Button -->
            <form th:action="@{/admin/drivers/delete/{id}(id=${driver.driverId})}"
                  method="post"
                  class="d-inline"
                  onsubmit="return confirm('Are you sure you want to delete this driver?');">

              <button type="submit" class="btn btn-danger btn-sm">
                Delete
              </button>
            </form>
          </td>
        </tr>

        <tr th:if="${#lists.isEmpty(drivers)}">
          <td colspan="7" class="text-center text-muted">
            No drivers registered yet.
          </td>
        </tr>
        </tbody>
      </table>

    </div>
  </div>

</div>

</body>
</html>
