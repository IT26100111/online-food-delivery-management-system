
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Deliveries | FoodFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fb;
        }

        .sidebar {
            width: 250px;
            min-height: 100vh;
            background: #172554;
            color: white;
            position: fixed;
            padding: 25px 18px;
        }

        .brand {
            font-size: 23px;
            font-weight: 800;
            margin-bottom: 40px;
        }

        .sidebar a {
            display: block;
            color: #cbd5e1;
            text-decoration: none;
            padding: 13px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .sidebar a.active,
        .sidebar a:hover {
            background: #2563eb;
            color: white;
        }

        .main-content {
            margin-left: 250px;
            padding: 35px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 800;
            color: #172554;
        }

        .delivery-card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.04);
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                min-height: auto;
                position: relative;
            }

            .main-content {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<aside class="sidebar">

    <div class="brand">
        <i class="fa-solid fa-utensils"></i> FoodFlow
    </div>

    <a href="/driver/dashboard">
        <i class="fa-solid fa-house me-2"></i>
        Dashboard
    </a>

    <a href="/driver/deliveries" class="active">
        <i class="fa-solid fa-truck me-2"></i>
        My Deliveries
    </a>

    <a href="/driver/profile">
        <i class="fa-solid fa-user me-2"></i>
        My Profile
    </a>

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-outline-light w-100 mt-4">
            <i class="fa-solid fa-right-from-bracket me-2"></i>
            Logout
        </button>
    </form>

</aside>

<main class="main-content">

    <h2 class="page-title">My Deliveries</h2>

    <p class="text-muted mb-4">
        View all deliveries assigned to your driver account.
    </p>

    <div th:if="${#lists.isEmpty(deliveries)}"
         class="alert alert-info">
        <i class="fa-solid fa-circle-info me-2"></i>
        No deliveries have been assigned to you yet.
    </div>

    <div th:each="delivery : ${deliveries}"
         class="delivery-card">

        <div class="d-flex justify-content-between align-items-start flex-wrap">

            <div>
                <h5 class="fw-bold">
                    Delivery #<span th:text="${delivery.deliveryId}"></span>
                </h5>

                <p class="mb-1">
                    <strong>Order ID:</strong>
                    <span th:text="${delivery.orderId}"></span>
                </p>

                <p class="mb-1">
                    <strong>Customer Address:</strong>
                    <span th:text="${delivery.deliveryAddress}"></span>
                </p>

                <p class="mb-1">
                    <strong>Delivery Date:</strong>
                    <span th:text="${delivery.deliveryDate}"></span>
                </p>

                <p class="mb-1">
                    <strong>Phone:</strong>
                    <span th:text="${delivery.phoneNumber}"></span>
                </p>
            </div>

            <div class="mt-2">
                <span class="badge bg-primary"
                      th:text="${delivery.deliveryStatus}">
                </span>
            </div>

        </div>

    </div>

    <a href="/driver/dashboard" class="btn btn-outline-primary mt-3">
        <i class="fa-solid fa-arrow-left me-2"></i>
        Back to Dashboard
    </a>

</main>

</body>
</html>
