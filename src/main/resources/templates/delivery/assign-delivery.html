
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Delivery | FoodFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/dashboard.css" th:href="@{/css/dashboard.css}">
</head>

<body>

<div class="dashboard-wrapper">

    <aside class="sidebar">
        <a href="/" th:href="@{/}" class="sidebar-logo">
            <i class="fa-solid fa-bowl-food"></i>
            FoodFlow
        </a>

        <ul class="sidebar-menu">
            <li><a href="/dashboard" th:href="@{/dashboard}"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
            <li><a href="/customer" th:href="@{/customer}"><i class="fa-solid fa-users"></i> Customers</a></li>
            <li><a href="/restaurant" th:href="@{/restaurant}"><i class="fa-solid fa-store"></i> Restaurants</a></li>
            <li><a href="/food" th:href="@{/food}"><i class="fa-solid fa-burger"></i> Food Items</a></li>
            <li><a href="#"><i class="fa-solid fa-receipt"></i> Orders</a></li>
            <li><a href="/delivery" th:href="@{/delivery}" class="active"><i class="fa-solid fa-motorcycle"></i> Deliveries</a></li>
            <li><a href="#"><i class="fa-solid fa-credit-card"></i> Payments</a></li>
            <li><a href="#"><i class="fa-solid fa-comment-dots"></i> Feedback</a></li>
            <li><a href="/" th:href="@{/}"><i class="fa-solid fa-house"></i> Back to Home</a></li>
        </ul>
    </aside>

    <main class="main-content">

        <div class="topbar">
            <div>
                <h3>Assign Delivery</h3>
                <p>Assign a registered delivery driver to an order.</p>
            </div>

            <div class="admin-badge">
                <i class="fa-solid fa-motorcycle"></i>
                Delivery Panel
            </div>
        </div>

        <div class="content-card">

            <h5 class="mb-4">Delivery Information</h5>

            <form method="post"
                  th:action="@{/delivery/add}"
                  th:object="${delivery}">

                <div class="row g-4">

                    <!-- Order ID -->
                    <div class="col-md-6">
                        <label for="orderId" class="form-label">Order ID</label>

                        <input id="orderId"
                               type="number"
                               th:field="*{orderId}"
                               class="form-control"
                               required min="1">

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('orderId')}"
                             th:errors="*{orderId}"></div>
                    </div>

                    <!-- Driver Selection -->
                    <div class="col-md-6">

                        <label for="driverId" class="form-label">
                            Select Delivery Driver
                        </label>

                        <select id="driverId"
                                name="driverId"
                                class="form-select"
                                required
                                onchange="updateDriverDetails()">

                            <option value="">Select a Driver</option>

                            <option th:each="driver : ${drivers}"
                                    th:value="${driver.driverId}"
                                    th:text="${driver.fullName + ' (ID: ' + driver.driverId + ')'}"
                                    th:attr="data-phone=${driver.phoneNumber},
                                             data-name=${driver.fullName},
                                             data-status=${driver.status}">
                            </option>

                        </select>

                        <small class="text-muted">
                            Select an active registered driver.
                        </small>

                        <div class="text-danger"
                             th:if="${driverError}"
                             th:text="${driverError}">
                        </div>

                    </div>

                    <!-- Driver Name -->
                    <div class="col-md-6">

                        <label for="deliveryPersonName" class="form-label">
                            Delivery Person Name
                        </label>

                        <input id="deliveryPersonName"
                               type="text"
                               th:field="*{deliveryPersonName}"
                               class="form-control"
                               readonly
                               required>

                    </div>

                    <!-- Driver Phone -->
                    <div class="col-md-6">

                        <label for="phoneNumber" class="form-label">
                            Phone Number
                        </label>

                        <input id="phoneNumber"
                               type="tel"
                               th:field="*{phoneNumber}"
                               class="form-control"
                               readonly
                               required>

                    </div>

                    <!-- Delivery Date -->
                    <div class="col-md-6">

                        <label for="deliveryDate" class="form-label">
                            Delivery Date
                        </label>

                        <input id="deliveryDate"
                               type="date"
                               th:field="*{deliveryDate}"
                               class="form-control"
                               required>

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('deliveryDate')}"
                             th:errors="*{deliveryDate}">
                        </div>

                    </div>

                    <!-- Delivery Address -->
                    <div class="col-12">

                        <label for="deliveryAddress" class="form-label">
                            Delivery Address
                        </label>

                        <textarea id="deliveryAddress"
                                  th:field="*{deliveryAddress}"
                                  class="form-control"
                                  rows="3"
                                  required
                                  maxlength="255"></textarea>

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('deliveryAddress')}"
                             th:errors="*{deliveryAddress}">
                        </div>

                    </div>

                    <!-- Delivery Status -->
                    <div class="col-md-6">

                        <label for="deliveryStatus" class="form-label">
                            Delivery Status
                        </label>

                        <select id="deliveryStatus"
                                th:field="*{deliveryStatus}"
                                class="form-select"
                                required>

                            <option value="">Select Status</option>

                            <option th:each="status : ${deliveryStatuses}"
                                    th:value="${status}"
                                    th:text="${status}">
                            </option>

                        </select>

                        <div class="text-danger"
                             th:if="${#fields.hasErrors('deliveryStatus')}"
                             th:errors="*{deliveryStatus}">
                        </div>

                    </div>

                    <!-- Buttons -->
                    <div class="col-12 d-flex gap-3 mt-4">

                        <button type="submit" class="btn btn-warning">
                            <i class="fa-solid fa-check"></i>
                            Assign Delivery
                        </button>

                        <a href="/delivery"
                           th:href="@{/delivery}"
                           class="btn btn-outline-secondary">
                            Cancel
                        </a>

                    </div>

                </div>

            </form>

        </div>

    </main>

</div>

<script>

    function updateDriverDetails() {

        const driverSelect = document.getElementById("driverId");

        const selectedOption =
            driverSelect.options[driverSelect.selectedIndex];

        const nameField =
            document.getElementById("deliveryPersonName");

        const phoneField =
            document.getElementById("phoneNumber");

        if (!driverSelect.value) {
            nameField.value = "";
            phoneField.value = "";
            return;
        }

        const status = (selectedOption.dataset.status || "")
            .trim()
            .toLowerCase();

        if (status !== "active") {

            alert("This driver is inactive. Please select an active driver.");

            driverSelect.value = "";
            nameField.value = "";
            phoneField.value = "";

            return;
        }

        nameField.value = selectedOption.dataset.name || "";
        phoneField.value = selectedOption.dataset.phone || "";

        console.log("Selected Driver ID:", driverSelect.value);
        console.log("Selected Driver Name:", nameField.value);
    }

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
