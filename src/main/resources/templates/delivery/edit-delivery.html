
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Delivery | FoodFlow</title>

    <!-- Same styling as Admin Dashboard -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>

<body>

<div class="dashboard-wrapper">

    <!-- Sidebar -->
    <aside class="sidebar">

        <a href="/" class="sidebar-logo">
            <i class="fa-solid fa-bowl-food"></i>
            FoodFlow
        </a>

        <ul class="sidebar-menu">
            <li><a href="/dashboard"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
            <li><a href="/customer"><i class="fa-solid fa-users"></i> Customers</a></li>
            <li><a href="#"><i class="fa-solid fa-store"></i> Restaurants</a></li>
            <li><a href="#"><i class="fa-solid fa-burger"></i> Food Items</a></li>
            <li><a href="#"><i class="fa-solid fa-receipt"></i> Orders</a></li>
            <li><a href="/delivery" class="active"><i class="fa-solid fa-motorcycle"></i> Deliveries</a></li>
            <li><a href="#"><i class="fa-solid fa-credit-card"></i> Payments</a></li>
            <li><a href="#"><i class="fa-solid fa-comment-dots"></i> Feedback</a></li>
            <li><a href="/"><i class="fa-solid fa-house"></i> Back to Home</a></li>
        </ul>

    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <div class="topbar">
            <div>
                <h3>Edit Delivery</h3>
                <p>Update delivery information and status.</p>
            </div>

            <div class="admin-badge">
                <i class="fa-solid fa-motorcycle"></i>
                Delivery Panel
            </div>
        </div>

        <!-- Edit Form -->
        <div class="content-card">

            <h5 class="mb-4">Update Delivery Information</h5>

            <form th:action="@{/delivery/edit/{id}(id=${delivery.deliveryId})}"
                  th:object="${delivery}"
                  method="post">

                <div class="row g-4">

                    <!-- Order ID -->
                    <div class="col-md-6">
                        <label class="form-label">Order ID</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{orderId}"
                               min="1"
                               required>
                    </div>

                    <!-- Delivery Person Name -->
                    <div class="col-md-6">
                        <label class="form-label">Delivery Person Name</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{deliveryPersonName}"
                               required>
                    </div>

                    <!-- Phone Number -->
                    <div class="col-md-6">
                        <label class="form-label">Phone Number</label>
                        <input type="tel"
                               class="form-control"
                               th:field="*{phoneNumber}"
                               pattern="[0-9]{10}"
                               maxlength="10"
                               required>
                    </div>

                    <!-- Delivery Date -->
                    <div class="col-md-6">
                        <label class="form-label">Delivery Date</label>
                        <input type="date"
                               class="form-control"
                               th:field="*{deliveryDate}"
                               required>
                    </div>

                    <!-- Delivery Address -->
                    <div class="col-12">
                        <label class="form-label">Delivery Address</label>
                        <textarea class="form-control"
                                  th:field="*{deliveryAddress}"
                                  rows="3"
                                  required></textarea>
                    </div>

                    <!-- Delivery Status -->
                    <div class="col-md-6">
                        <label class="form-label">Delivery Status</label>
                        <select class="form-select"
                                th:field="*{deliveryStatus}"
                                required>
                            <option value="Pending">Pending</option>
                            <option value="Assigned">Assigned</option>
                            <option value="Out for Delivery">Out for Delivery</option>
                            <option value="Delivered">Delivered</option>
                        </select>
                    </div>

                </div>

                <!-- Buttons -->
                <div class="d-flex gap-3 mt-4">

                    <button type="submit" class="btn btn-warning">
                        <i class="fa-solid fa-check"></i>
                        Update Delivery
                    </button>

                    <a href="/delivery" class="btn btn-outline-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
