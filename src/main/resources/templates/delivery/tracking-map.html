
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live Delivery Tracking | FoodFlow</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f6fa;
        padding: 25px;
    }

    .tracking-card {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    #map {
        height: 500px;
        width: 100%;
        border-radius: 10px;
        margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="tracking-card">

    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h3>Live Delivery Tracking</h3>
        <p class="text-muted">
          View the delivery driver's current location.
        </p>
      </div>

      <a th:href="@{/delivery}" class="btn btn-outline-secondary">
        Back to Deliveries
      </a>
    </div>

    <hr>

    <h5>
      Delivery ID:
      <span th:text="${delivery.deliveryId}">1</span>
    </h5>

    <p>
      Delivery Person:
      <strong th:text="${delivery.deliveryPersonName}">Driver</strong>
    </p>

    <p>
      Status:
      <strong th:text="${delivery.deliveryStatus}">Assigned</strong>
    </p>

    <div class="alert alert-info" id="locationStatus">
      Waiting for driver location...
    </div>

    <div id="map"></div>

  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script th:inline="javascript">

  const deliveryId = /*[[${delivery.deliveryId}]]*/ 1;

  const map = L.map('map').setView([6.9271, 79.8612], 13);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  let driverMarker = null;

  const status = document.getElementById('locationStatus');

  function updateMap(latitude, longitude) {

      const position = [latitude, longitude];

      if (driverMarker === null) {
          driverMarker = L.marker(position)
              .addTo(map)
              .bindPopup('Delivery Driver');
      } else {
          driverMarker.setLatLng(position);
      }

      map.setView(position, 16);
  }

  async function getLatestLocation() {

      try {
          const response = await fetch(
              `/api/delivery/${deliveryId}/location`
          );

          if (response.status === 404) {
              status.textContent = 'Waiting for driver location...';
              return;
          }

          if (!response.ok) {
              throw new Error('Could not retrieve location');
          }

          const location = await response.json();

          updateMap(location.latitude, location.longitude);

          status.textContent = 'Driver location is being updated automatically.';

      } catch (error) {
          status.textContent = 'Unable to retrieve driver location.';
          console.error(error);
      }
  }

  getLatestLocation();

  setInterval(getLatestLocation, 5000);

</script>

</body>
</html>
