<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payments | FoodFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div class="dashboard-wrapper">

  <!-- Shared Admin Sidebar -->
  <div th:replace="~{fragments/admin-sidebar :: sidebar('payment')}"></div>

  <main class="main-content">

    <div class="topbar">
      <div><h1>Payment Management</h1><p>Manage order payment records and payment status.</p></div>
      <a th:href="@{/payment/add}" class="btn btn-warning fw-bold rounded-4 px-4"><i class="fa-solid fa-plus"></i> Add Payment</a>
    </div>
    <section class="content-card">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <div><h4 class="fw-bold mb-1">Payment List</h4><p class="text-muted mb-0">Records linked to actual orders.</p></div>
        <input id="paymentSearch" type="search" class="form-control" style="max-width:250px" placeholder="Search payments..." aria-label="Search payments">
      </div>
      <div class="table-responsive">
        <table class="table align-middle custom-table" id="paymentsTable">
          <thead><tr><th>Payment ID</th><th>Order ID</th><th>Customer</th><th>Method</th><th>Amount</th><th>Date</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(payments)}"><td colspan="8" class="text-center text-muted py-4">No payments found.</td></tr>
            <tr th:each="payment : ${payments}">
              <td th:text="${payment.paymentId}">1</td>
              <td th:text="${payment.order.orderId}">101</td>
              <td th:text="${payment.order.customer != null ? payment.order.customer.fullName : 'No Customer'}">Customer</td>
              <td th:text="${payment.paymentMethod.displayName}">Cash</td>
              <td th:text="|Rs. ${payment.amount}|">Rs. 2500</td>
              <td th:text="${payment.paymentDate}">2026-11-04</td>
              <td><span class="badge" th:text="${payment.paymentStatus.displayName}"
                        th:classappend="${payment.paymentStatus.name() == 'PAID' ? 'bg-success' : (payment.paymentStatus.name() == 'FAILED' ? 'bg-danger' : 'bg-warning text-dark')}">Pending</span></td>
              <td class="text-end">
                <div class="d-inline-flex gap-2">
                  <a th:href="@{/payment/edit/{id}(id=${payment.paymentId})}" class="btn btn-sm btn-outline-primary rounded-3" aria-label="Edit payment"><i class="fa-solid fa-pen"></i></a>
                  <form th:action="@{/payment/delete/{id}(id=${payment.paymentId})}" method="post" onsubmit="return confirm('Delete this payment record?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger rounded-3" aria-label="Delete payment"><i class="fa-solid fa-trash"></i></button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>
<script>
  const input = document.getElementById('paymentSearch');
  input.addEventListener('input', () => {
    const query = input.value.toLowerCase().trim();
    for (const row of document.querySelectorAll('#paymentsTable tbody tr')) {
      row.hidden = !row.innerText.toLowerCase().includes(query);
    }
  });
</script>
</body>
</html>
