<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Add Customer | FoodFlow</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="/css/dashboard.css">
</head>

<body>

<div class="dashboard-wrapper">

  <aside class="sidebar">
    <a href="/" class="sidebar-logo">
      <i class="fa-solid fa-bowl-food"></i>
      FoodFlow
    </a>

    <ul class="sidebar-menu">
      <li><a href="/dashboard"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
      <li><a href="/customer" class="active"><i class="fa-solid fa-users"></i> Customers</a></li>
      <li><a href="/restaurant"><i class="fa-solid fa-store"></i> Restaurants</a></li>
      <li><a href="/food"><i class="fa-solid fa-burger"></i> Food Items</a></li>
      <li><a href="/order"><i class="fa-solid fa-receipt"></i> Orders</a></li>
      <li><a href="/delivery"><i class="fa-solid fa-truck"></i> Delivery</a></li>
      <li><a href="/payment"><i class="fa-solid fa-credit-card"></i> Payments</a></li>
      <li><a href="/feedback"><i class="fa-solid fa-star"></i> Feedback</a></li>
    </ul>
  </aside>

  <main class="main-content">

    <div class="topbar">
      <div>
        <h1>Add Customer</h1>
        <p>Register a new customer to the system.</p>
      </div>

      <a href="/customer" class="btn btn-outline-secondary rounded-4 px-4">
        <i class="fa-solid fa-arrow-left"></i> Back
      </a>
    </div>

    <section class="content-card">

      <form th:action="@{/customer/add}" th:object="${customer}" method="post">

        <div class="row g-4">

          <div class="col-md-6">
            <label class="form-label fw-semibold">Full Name</label>
            <input type="text"
                   class="form-control form-control-lg rounded-4"
                   th:field="*{fullName}"
                   placeholder="Enter full name"
                   required>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Email</label>
            <input type="email"
                   class="form-control form-control-lg rounded-4"
                   th:field="*{email}"
                   placeholder="Enter email address"
                   required>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Phone Number</label>
            <input type="text"
                   class="form-control form-control-lg rounded-4"
                   th:field="*{phoneNumber}"
                   placeholder="Enter phone number"
                   required>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Status</label>
            <select class="form-select form-select-lg rounded-4" th:field="*{status}">
              <option value="Active">Active</option>
              <option value="Pending">Pending</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold">Address</label>
            <textarea class="form-control rounded-4"
                      rows="4"
                      th:field="*{address}"
                      placeholder="Enter customer address"
                      required></textarea>
          </div>

          <div class="col-12 d-flex gap-3 mt-4">
            <button type="submit" class="btn btn-warning fw-bold rounded-4 px-5 py-3">
              <i class="fa-solid fa-floppy-disk"></i> Save Customer
            </button>

            <a href="/customer" class="btn btn-light fw-bold rounded-4 px-5 py-3">
              Cancel
            </a>
          </div>

        </div>

      </form>

    </section>

  </main>

</div>

</body>
</html>
