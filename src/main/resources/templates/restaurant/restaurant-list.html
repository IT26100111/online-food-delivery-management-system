<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Restaurant Management</title>

  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
  >

  <link
          rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >
</head>

<body>

<div class="container py-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="mb-1">Restaurant Management</h2>
      <p class="text-muted mb-0">
        Manage registered restaurants
      </p>
    </div>

    <a th:href="@{/restaurant/add}"
       class="btn btn-primary">
      <i class="fa-solid fa-plus me-1"></i>
      Add Restaurant
    </a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">

      <div class="table-responsive">

        <table class="table table-hover align-middle">

          <thead class="table-light">
          <tr>
            <th>ID</th>
            <th>Restaurant</th>
            <th>Cuisine</th>
            <th>Phone</th>
            <th>Address</th>
            <th>Status</th>
            <th class="text-center">Actions</th>
          </tr>
          </thead>

          <tbody>

          <tr th:each="restaurant : ${restaurants}">

            <td th:text="${restaurant.restaurantId}">
              1
            </td>

            <td th:text="${restaurant.restaurantName}">
              Restaurant Name
            </td>

            <td th:text="${restaurant.cuisineType}">
              Cuisine
            </td>

            <td th:text="${restaurant.phoneNumber}">
              0771234567
            </td>

            <td th:text="${restaurant.address}">
              Address
            </td>

            <td>
                            <span
                                    th:if="${restaurant.active}"
                                    class="badge bg-success">
                                Active
                            </span>

              <span
                      th:unless="${restaurant.active}"
                      class="badge bg-secondary"
                      th:text="${restaurant.status}">
                                Inactive
                            </span>
            </td>

            <td class="text-center">

              <a
                      th:href="@{/restaurant/edit/{id}(id=${restaurant.restaurantId})}"
                      class="btn btn-sm btn-warning me-1">

                <i class="fa-solid fa-pen"></i>
                Edit
              </a>


              <!-- Secure Restaurant Delete -->
              <form th:action="@{/restaurant/delete/{id}(id=${restaurant.restaurantId})}"
                    method="post"
                    class="d-inline"
                    onsubmit="return confirm('Are you sure you want to delete this restaurant?');">

                <!-- CSRF Token -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit"
                        class="btn btn-sm btn-danger">

                  <i class="fa-solid fa-trash"></i>
                  Delete

                </button>

              </form>


            </td>

          </tr>

          <tr th:if="${#lists.isEmpty(restaurants)}">
            <td colspan="7"
                class="text-center text-muted py-4">

              No restaurants found.

            </td>
          </tr>

          </tbody>

        </table>

      </div>

    </div>
  </div>

</div>

</body>
</html>
