<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Restaurant | FoodFlow Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <a th:href="@{/restaurant}" class="text-secondary text-decoration-none small">
        <i class="fa-solid fa-arrow-left me-1"></i> Back to restaurants
      </a>
      <div class="card border-0 shadow-sm mt-3">
        <div class="card-body p-4 p-lg-5">
          <h1 class="h3 mb-1">Edit Restaurant</h1>
          <p class="text-muted mb-4">Modify the saved restaurant. Setting it Inactive hides it publicly.</p>
          <form th:action="@{/restaurant/edit/{id}(id=${restaurantId})}"
                th:object="${restaurant}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="row g-3">
              <div class="col-12">
                <label for="restaurantName" class="form-label fw-semibold">Restaurant name</label>
                <input id="restaurantName" type="text" class="form-control" th:field="*{restaurantName}"
                       th:classappend="${#fields.hasErrors('restaurantName')} ? 'is-invalid' : ''"
                       minlength="2" maxlength="100" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('restaurantName')}"
                     th:errors="*{restaurantName}">Name required</div>
              </div>
              <div class="col-md-6">
                <label for="cuisineType" class="form-label fw-semibold">Cuisine</label>
                <input id="cuisineType" type="text" class="form-control" th:field="*{cuisineType}"
                       th:classappend="${#fields.hasErrors('cuisineType')} ? 'is-invalid' : ''"
                       maxlength="60" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('cuisineType')}"
                     th:errors="*{cuisineType}">Cuisine required</div>
              </div>
              <div class="col-md-6">
                <label for="phoneNumber" class="form-label fw-semibold">Phone number</label>
                <input id="phoneNumber" type="tel" class="form-control" th:field="*{phoneNumber}"
                       th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid' : ''"
                       placeholder="0771234567" pattern="[0-9]{10}" maxlength="10" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('phoneNumber')}"
                     th:errors="*{phoneNumber}">10 digits required</div>
                <div class="form-text">Use exactly 10 digits, without spaces.</div>
              </div>
              <div class="col-12">
                <label for="address" class="form-label fw-semibold">Address</label>
                <textarea id="address" rows="3" class="form-control" th:field="*{address}"
                          th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''"
                          maxlength="255" required></textarea>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}"
                     th:errors="*{address}">Address required</div>
              </div>
              <div class="col-12">
                <label for="status" class="form-label fw-semibold">Status</label>
                <select id="status" class="form-select" th:field="*{status}"
                        th:classappend="${#fields.hasErrors('status')} ? 'is-invalid' : ''" required>
                  <option value="">Choose status</option>
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('status')}"
                     th:errors="*{status}">Choose a status</div>
              </div>
              <div class="col-12 mt-4 d-flex gap-2 flex-wrap">
                <button type="submit" class="btn btn-primary px-4">Update Restaurant</button>
                <a th:href="@{/restaurant}" class="btn btn-outline-secondary px-4">Cancel</a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
