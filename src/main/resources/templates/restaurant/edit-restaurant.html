<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Edit Restaurant</title>

  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
  >
</head>

<body>

<div class="container py-5">

  <div class="row justify-content-center">

    <div class="col-lg-7">

      <div class="card shadow-sm">

        <div class="card-header bg-white py-3">

          <h3 class="mb-0">
            Edit Restaurant
          </h3>

        </div>

        <div class="card-body p-4">

          <form
                  th:action="@{/restaurant/edit/{id}(id=${restaurant.restaurantId})}"
                  th:object="${restaurant}"
                  method="post">

            <!-- Restaurant Name -->
            <div class="mb-3">

              <label class="form-label">
                Restaurant Name
              </label>

              <input
                      type="text"
                      class="form-control"
                      th:field="*{restaurantName}"
                      th:classappend="${#fields.hasErrors('restaurantName')} ? 'is-invalid' : ''"
                      required
                      minlength="2"
                      maxlength="100">

              <div
                      class="invalid-feedback"
                      th:if="${#fields.hasErrors('restaurantName')}"
                      th:errors="*{restaurantName}">
              </div>

            </div>

            <!-- Cuisine Type -->
            <div class="mb-3">

              <label class="form-label">
                Cuisine Type
              </label>

              <input
                      type="text"
                      class="form-control"
                      th:field="*{cuisineType}"
                      th:classappend="${#fields.hasErrors('cuisineType')} ? 'is-invalid' : ''"
                      required
                      maxlength="60">

              <div
                      class="invalid-feedback"
                      th:if="${#fields.hasErrors('cuisineType')}"
                      th:errors="*{cuisineType}">
              </div>

            </div>

            <!-- Phone Number -->
            <div class="mb-3">

              <label class="form-label">
                Phone Number
              </label>

              <input
                      type="tel"
                      class="form-control"
                      th:field="*{phoneNumber}"
                      th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid' : ''"
                      required
                      pattern="[0-9]{10}"
                      maxlength="10"
                      placeholder="0771234567">

              <div
                      class="invalid-feedback"
                      th:if="${#fields.hasErrors('phoneNumber')}"
                      th:errors="*{phoneNumber}">
              </div>

            </div>

            <!-- Address -->
            <div class="mb-3">

              <label class="form-label">
                Address
              </label>

              <textarea
                      class="form-control"
                      th:field="*{address}"
                      th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''"
                      rows="3"
                      required
                      maxlength="255">
                            </textarea>

              <div
                      class="invalid-feedback"
                      th:if="${#fields.hasErrors('address')}"
                      th:errors="*{address}">
              </div>

            </div>

            <!-- Status -->
            <div class="mb-4">

              <label class="form-label">
                Status
              </label>

              <select
                      class="form-select"
                      th:field="*{status}"
                      th:classappend="${#fields.hasErrors('status')} ? 'is-invalid' : ''"
                      required>

                <option value="Active">
                  Active
                </option>

                <option value="Inactive">
                  Inactive
                </option>

              </select>

              <div
                      class="invalid-feedback"
                      th:if="${#fields.hasErrors('status')}"
                      th:errors="*{status}">
              </div>

            </div>

            <!-- Buttons -->
            <div class="d-flex gap-2">

              <button
                      type="submit"
                      class="btn btn-primary">

                Update Restaurant

              </button>

              <a
                      th:href="@{/restaurant}"
                      class="btn btn-outline-secondary">

                Cancel

              </a>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

</div>

</body>
</html>
