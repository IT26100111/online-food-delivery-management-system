<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Restaurant | FoodFlow</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="/css/dashboard.css">
</head>

<body>

<div class="dashboard-wrapper">

  <aside class="sidebar">
    <a href="/" class="sidebar-logo">
      <i class="fa-solid fa-bowl-food"></i>
      FoodFlow
    </a>

    <ul class="sidebar-menu">
      <li><a href="/dashboard"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
      <li><a href="/customer"><i class="fa-solid fa-users"></i> Customers</a></li>
      <li><a href="/restaurant" class="active"><i class="fa-solid fa-store"></i> Restaurants</a></li>
      <li><a href="/food"><i class="fa-solid fa-burger"></i> Food Items</a></li>
      <li><a href="#"><i class="fa-solid fa-receipt"></i> Orders</a></li>
      <li><a href="#"><i class="fa-solid fa-motorcycle"></i> Deliveries</a></li>
      <li><a href="#"><i class="fa-solid fa-credit-card"></i> Payments</a></li>
      <li><a href="#"><i class="fa-solid fa-comment-dots"></i> Feedback</a></li>
      <li><a href="/"><i class="fa-solid fa-house"></i> Back to Home</a></li>
    </ul>
  </aside>

  <main class="main-content">

    <div class="topbar">
      <div>
        <h3>Edit Restaurant</h3>
        <p>Update restaurant information and availability status.</p>
      </div>

      <a href="/restaurant" class="btn btn-outline-dark fw-bold rounded-4 px-4">
        <i class="fa-solid fa-arrow-left"></i> Back
      </a>
    </div>

    <div class="content-card">
      <h5>Update Restaurant Details</h5>

      <form>
        <div class="row g-4">
          <div class="col-md-6">
            <label class="form-label fw-bold">Restaurant Name</label>
            <input type="text" class="form-control form-control-lg rounded-4" value="Urban Bites">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">Owner Name</label>
            <input type="text" class="form-control form-control-lg rounded-4" value="Kasun Silva">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">Contact Number</label>
            <input type="text" class="form-control form-control-lg rounded-4" value="0771234567">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">Cuisine Type</label>
            <select class="form-select form-select-lg rounded-4">
              <option>Sri Lankan</option>
              <option selected>Fast Food</option>
              <option>Italian</option>
              <option>Indian</option>
              <option>Chinese</option>
              <option>Dessert</option>
              <option>Beverages</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">Restaurant Status</label>
            <select class="form-select form-select-lg rounded-4">
              <option selected>Open</option>
              <option>Busy</option>
              <option>Closed</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">Location</label>
            <input type="text" class="form-control form-control-lg rounded-4" value="Colombo">
          </div>

          <div class="col-12">
            <label class="form-label fw-bold">Address</label>
            <textarea class="form-control rounded-4" rows="4">No 25, Main Street, Colombo</textarea>
          </div>

          <div class="col-12 d-flex gap-3">
            <button type="button" class="btn btn-warning fw-bold rounded-4 px-5 py-3">
              <i class="fa-solid fa-pen-to-square"></i> Update Restaurant
            </button>

            <a href="/restaurant" class="btn btn-outline-secondary fw-bold rounded-4 px-5 py-3">
              Cancel
            </a>
          </div>
        </div>
      </form>
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
