<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Add Order | FoodFlow</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<div class="container py-5">

  <div class="row justify-content-center">

    <div class="col-lg-8">

      <div class="mb-4">

        <h2 class="fw-bold mb-1">
          Add New Order
        </h2>

        <p class="text-muted mb-0">
          Enter the customer order details.
        </p>

      </div>


      <div class="card shadow-sm border-0">

        <div class="card-body p-4">


          <form th:action="@{/order/add}"
                th:object="${order}"
                method="post">

            <div th:if="${param.foodError}"
                 class="alert alert-danger">
              Selected food item could not be found.
            </div>

            <div th:if="${param.quantityError}"
                 class="alert alert-danger">
              Quantity must be at least 1.
            </div>

            <div th:if="${param.unavailable}"
                 class="alert alert-warning">
              This food item is currently unavailable.
            </div>


            <!-- CUSTOMER NAME -->

            <div class="mb-3">

              <label class="form-label">
                Customer Name
              </label>

              <div class="mb-3">

                <label class="form-label">
                  Customer
                </label>

                <select class="form-select"
                        name="customerId"
                        required>

                  <option value="">
                    Select customer
                  </option>

                  <option th:each="customer : ${customers}"
                          th:value="${customer.customerId}"
                          th:text="${customer.fullName}">
                  </option>

                </select>

              </div>

            </div>


            <!-- RESTAURANT NAME -->

            <div class="mb-3">

              <label class="form-label">
                Restaurant Name
              </label>

              <input type="text"
                     class="form-control"
                     th:field="*{restaurantName}"
                     placeholder="Enter restaurant name"
                     required>

            </div>


            <!-- ORDER DATE -->

            <div class="mb-3">

              <label class="form-label">
                Order Date
              </label>

              <input type="date"
                     class="form-control"
                     th:field="*{orderDate}"
                     required>

            </div>



            <!-- STATUS -->

            <div class="mb-3">

              <label class="form-label">
                Order Status
              </label>

              <select class="form-select"
                      th:field="*{status}"
                      required>

                <option value="PENDING">
                  Pending
                </option>

                <option value="PREPARING">
                  Preparing
                </option>

                <option value="READY">
                  Ready
                </option>

                <option value="OUT_FOR_DELIVERY">
                  Out for Delivery
                </option>

                <option value="DELIVERED">
                  Delivered
                </option>

                <option value="CANCELLED">
                  Cancelled
                </option>

              </select>

            </div>


            <!-- DELIVERY ADDRESS -->

            <div class="mb-4">

              <label class="form-label">
                Delivery Address
              </label>

              <textarea class="form-control"
                        th:field="*{deliveryAddress}"
                        rows="3"
                        placeholder="Enter delivery address"
                        required>
                            </textarea>

            </div>


            <!-- BUTTONS -->

            <div class="d-flex gap-2">

              <button type="submit"
                      class="btn btn-primary">

                Save Order

              </button>


              <a th:href="@{/order}"
                 class="btn btn-outline-secondary">

                Cancel

              </a>

            </div>


          </form>


        </div>

      </div>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
