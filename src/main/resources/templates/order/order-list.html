<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Order Management | FoodFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body class="bg-light">

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold mb-1">
                Order Management
            </h2>

            <p class="text-muted mb-0">
                View and manage customer orders.
            </p>

        </div>


        <a th:href="@{/order/add}"
           class="btn btn-primary">

            Add Order

        </a>

    </div>


    <div class="card shadow-sm border-0">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Customer
                        </th>

                        <th>
                            Restaurant
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Total
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Address
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                    </thead>


                    <tbody>

                    <tr th:each="order : ${orders}">

                        <td th:text="${order.orderId}">
                            1
                        </td>


                        <td th:text="${order.customer != null ? order.customer.fullName : 'No Customer'}">
                            Customer
                        </td>


                        <td th:text="${order.restaurantName}">
                            Restaurant Name
                        </td>


                        <td th:text="${order.orderDate}">
                            2026-10-19
                        </td>


                        <td>
                            Rs.
                            <span th:text="${order.totalAmount}">
                                0.00
                            </span>
                        </td>


                        <td>
    <span th:switch="${order.status.name()}">

        <span th:case="'PENDING'"
              class="badge bg-secondary"
              th:text="${order.status.displayName}">
        </span>

        <span th:case="'PREPARING'"
              class="badge bg-warning text-dark"
              th:text="${order.status.displayName}">
        </span>

        <span th:case="'READY'"
              class="badge bg-info text-dark"
              th:text="${order.status.displayName}">
        </span>

        <span th:case="'OUT_FOR_DELIVERY'"
              class="badge bg-primary"
              th:text="${order.status.displayName}">
        </span>

        <span th:case="'DELIVERED'"
              class="badge bg-success"
              th:text="${order.status.displayName}">
        </span>

        <span th:case="'CANCELLED'"
              class="badge bg-danger"
              th:text="${order.status.displayName}">
        </span>

    </span>
                        </td>


                        <td th:text="${order.deliveryAddress}">
                            Address
                        </td>


                        <td>
                            <a th:href="@{/order/{id}(id=${order.orderId})}"
                               class="btn btn-sm btn-outline-dark">

                                View

                            </a>

                            <a th:href="@{/order/{id}/items/add(id=${order.orderId})}"
                               class="btn btn-sm btn-outline-success">

                                Add Item

                            </a>

                            <a th:href="@{/order/edit/{id}(id=${order.orderId})}"
                               class="btn btn-sm btn-outline-primary">

                                Edit

                            </a>


                            <a th:href="@{/order/delete/{id}(id=${order.orderId})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Are you sure you want to delete this order?')">

                                Delete

                            </a>

                        </td>

                    </tr>


                    <tr th:if="${#lists.isEmpty(orders)}">

                        <td colspan="8"
                            class="text-center text-muted py-4">

                            No orders available.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
