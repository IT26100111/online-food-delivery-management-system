<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Add Order Item | FoodFlow</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">


<div class="container py-5">

  <div class="row justify-content-center">

    <div class="col-lg-7">


      <div class="mb-4">

        <h2 class="fw-bold mb-1">
          Add Item to Order
        </h2>

        <p class="text-muted mb-0">

          Order #
          <span th:text="${order.orderId}">
            1
          </span>

          —

          <span th:text="${order.customer != null ? order.customer.fullName : 'No Customer'}">
            Customer
          </span>

        </p>

      </div>


      <div class="card border-0 shadow-sm">

        <div class="card-body p-4">


          <form th:action="@{/order/{id}/items/add(id=${order.orderId})}"
                th:object="${orderItem}"
                method="post">


            <!-- FOOD ITEM -->
            <div class="mb-3">

              <label class="form-label">
                Food Item
              </label>

              <select class="form-select"
                      name="foodItemId"
                      required>

                <option value="">
                  Select food item
                </option>

                <option th:each="food : ${foodItems}"
                        th:value="${food.foodItemId}"
                        th:text="|${food.foodName} - Rs. ${food.price}|">
                </option>

              </select>

            </div>


            <!-- QUANTITY -->
            <div class="mb-4">

              <label class="form-label">
                Quantity
              </label>

              <input type="number"
                     class="form-control"
                     th:field="*{quantity}"
                     min="1"
                     placeholder="Enter quantity"
                     required>

            </div>


            <!-- BUTTONS -->
            <div class="d-flex gap-2">

              <button type="submit"
                      class="btn btn-primary">

                Add Item

              </button>


              <a th:href="@{/order/{id}(id=${order.orderId})}"
                 class="btn btn-outline-secondary">

                Cancel

              </a>

            </div>


          </form>

        </div>

      </div>

    </div>

  </div>

</div>


</body>
</html>
