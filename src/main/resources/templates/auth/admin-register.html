
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration | FoodFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .register-card {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        h2 {
            color: #172554;
            font-weight: bold;
        }

        .form-control {
            padding: 12px;
        }

        .register-btn {
            background: #f59e0b;
            color: #172554;
            border: none;
            padding: 13px;
            width: 100%;
            font-weight: bold;
            border-radius: 8px;
        }

        .register-btn:hover {
            background: #d97706;
            color: white;
        }
    </style>
</head>

<body>

<div class="register-card">

    <h2 class="text-center mb-2">FoodFlow</h2>
    <h5 class="text-center mb-4">Create Admin Account</h5>

    <form th:action="@{/admin/account/register}" method="post">

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="fullName"
                   class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email"
                   class="form-control" required>
        </div>

        <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" name="password"
                   class="form-control" required minlength="8">
        </div>

        <button type="submit" class="register-btn">
            Create Admin Account
        </button>

    </form>

</div>

</body>
</html>
