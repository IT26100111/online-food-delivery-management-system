<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Login | FoodFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .brand {
            color: #ff6b35;
            font-size: 28px;
            font-weight: 800;
        }

        .login-btn {
            background: #ff6b35;
            color: white;
            border: none;
            padding: 12px;
            font-weight: 600;
        }

        .login-btn:hover {
            background: #e85b28;
            color: white;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="text-center mb-4">
        <div class="brand">FoodFlow</div>
        <h3 class="mt-3 fw-bold">Driver Login</h3>
        <p class="text-muted">Sign in to manage your deliveries</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger">
        Invalid email or password, or your driver account is inactive.
    </div>

    <div th:if="${param.logout}" class="alert alert-success">
        You have successfully logged out.
    </div>

    <form th:action="@{/login}" method="post">

        <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <input type="email"
                   name="username"
                   class="form-control"
                   placeholder="Enter your email"
                   required>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter your password"
                   required>
        </div>

        <button type="submit" class="btn login-btn w-100">
            Sign In
        </button>

    </form>

    <div class="text-center mt-4">
        <a th:href="@{/login}" class="text-decoration-none text-muted">
            Back to account selection
        </a>
    </div>

</div>

</body>
</html>
